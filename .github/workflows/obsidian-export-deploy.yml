name: Export Obsidian vault, build Jekyll, and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Obsidian → Jekyll export
        run: |
          python3 scripts/obsidian_to_jekyll.py --vault absurdly-goud-obsidian --out site_src

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - name: Build Jekyll site from exported source
        run: bundle exec jekyll build --source site_src --destination ./_site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
