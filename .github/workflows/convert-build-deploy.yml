name: Convert -> Build -> Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: '3.3.14'

      - name: Cache Ruby gems
        uses: actions/cache@v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}

      - name: Install Bundler & Gems
        run: |
          gem install bundler
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest tests/ -q

      - name: Restore generated site_src cache
        uses: actions/cache@v6.1.0
        with:
          path: site_src
          key: ${{ runner.os }}-site-src-${{ hashFiles('absurdly-goud-obsidian/**', 'scripts/**', '_includes/**', '_layouts/**', '_config.yml') }}
          restore-keys: |
            ${{ runner.os }}-site-src-

      - name: Prepare site_src (run converter or use committed site_src)
        run: |
          if [ -d absurdly-goud-obsidian ]; then
            echo "Found vault 'absurdly-goud-obsidian' — running converter..."
            python -m scripts.obsidian_to_jekyll --vault absurdly-goud-obsidian --out-dir site_src
          elif [ -d site_src ]; then
            echo "No vault found, but committed site_src exists — using it as-is."
          else
            echo "ERROR: No 'absurdly-goud-obsidian' vault and no committed 'site_src' directory."
            echo "Either commit the vault, commit generated site_src, or update the workflow."
            exit 1
          fi

      - name: Restore Jekyll build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .jekyll-cache
            .jekyll-metadata
          key: ${{ runner.os }}-jekyll-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ hashFiles('site_src/**') }}
          restore-keys: |
            ${{ runner.os }}-jekyll-

      - name: Generate syntax highlighting CSS via Rouge
        run: |
          echo "Checking if syntax highlighting CSS exists"
          if [ ! -f site_src/assets/css/syntax-highlighting.css ]; then
            echo "Generating syntax highlighting CSS via Rouge..."
            bundle exec rougify style monokai.sublime > site_src/assets/css/syntax-highlighting.css
          else
            echo "syntax-highlighting.css already exists, skipping generation"
          fi

      - name: Build site with Jekyll
        run: bundle exec jekyll build --source site_src --config _config.yml --destination _site --incremental

      - name: Write CNAME into built site
        run: |
          echo "absurdlygoud.com" > _site/CNAME

      - name: Deploy to gh-pages using peaceiris/actions-gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          allow_empty_commit: false
