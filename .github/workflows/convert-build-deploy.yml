name: Convert -> Build -> Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}

      - name: Install Bundler & Gems
        run: |
          gem install bundler
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Prepare site_src (run converter or use committed site_src)
        run: |
          echo "Repository root files:"
          ls -la
          if [ -d absurdly-goud-obsidian ]; then
            echo "Found vault 'absurdly-goud-obsidian' — running converter..."
            python scripts/obsidian_to_jekyll.py --vault absurdly-goud-obsidian --out site_src
          elif [ -d site_src ]; then
            echo "No vault found, but committed site_src exists — using it as-is."
          else
            echo "ERROR: No 'absurdly-goud-obsidian' vault and no committed 'site_src' directory.\nEither commit the vault, commit generated site_src, or update the workflow to fetch the vault from a secure location."
            exit 1
          fi

      - name: Build site with Jekyll
        run: bundle exec jekyll build --source site_src --config _config.yml --destination site

      - name: Deploy to gh-pages using peaceiris/actions-gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          allow_empty_commit: false
