# Popup metadata for inline images (buttons, memes, etc).
#
# image_vault:   path to the displayed image, relative to the vault root —
#                matched by filename against the same image_path_lookup the
#                converter already builds, so the folder here doesn't need
#                to match the output bucket exactly.
# image_source:  where "tell me more" goes. Either:
#                  - a URL (attribution / origin page), or
#                  - a local vault path to a bigger/original version, stored
#                    under assets/source/... mirroring assets/'s own layout.
# image_preview: optional. The image shown inside the popup itself, before
#                "tell me more" is clicked. Either a URL or a local vault
#                path, same rules as image_source. Falls back to the
#                displayed image (image_vault) if omitted.
# popup_blurb:   short text shown in the popup alongside the image.
#
# Any inline image NOT listed here still gets a popup — it just falls back
# to a self-link (the displayed image itself, shown as its own preview too)
# and a default blurb.
#
# NOTE: a local image_source/image_preview must NOT share a filename with
# its displayed counterpart — image resolution assumes filenames are unique
# across the whole vault (see build_image_path_lookup). Use a distinguishing
# name, e.g. "-original", for any locally-hosted bigger/original file.

image_popups:
  - image_vault: "assets/88x31/buttons-memes/free-real-estate.gif"
    image_source: "https://knowyourmeme.com/memes/its-free-real-estate"
    image_preview: "https://i.kym-cdn.com/entries/icons/original/000/029/959/Screen_Shot_2019-05-17_at_3.36.21_PM.jpg"
    popup_blurb: "Cloning the repo is basically free real estate — the whole point of publicly available code."

  - image_vault: "assets/88x31/buttons-memes/this-is-fine-fire.gif"
    image_source: "https://knowyourmeme.com/memes/this-is-fine"
    popup_blurb: "The internet, most days."

  - image_vault: "assets/88x31/buttons-memes/good-news-everyone.gif"
    image_source: "assets/source/88x31/buttons-memes/good-news-everyone-original.gif"
    image_preview: "assets/source/88x31/buttons-memes/good-news-everyone-original.gif"
    popup_blurb: "Professor Farnsworth's catchphrase from Futurama — the local file here is a higher-res original, not an attribution link."

  - image_vault: "assets/88x31/buttons-memes/approved-sonic-knuckles.gif"
    image_source: "https://knowyourmeme.com/memes/knuckles-sonic-the-hedgehog"
    popup_blurb: "Knuckles giving his seal of approval."

  # calculating-puzzled.gif intentionally has no entry — used to test the
  # fallback path (self-link + default blurb + default preview) once
  # image_popups.py exists.