  #---------------------------
  # Tidbits Below
  #---------------------------
  
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-java-bean-and-jar.svg"
    image_source: "https://en.wikipedia.org/wiki/Java_class_file#Magic_Number"
    pun_alt_text: "Java, Bean, Jar, CafeBabe"
    popup_blurb: "The programming language called Java has many puns: Plain Old Java Objects (POJO) are called BEANs; once compiled, the zipped folder is called a JAR; The bytes themselves begin with a security check: 0xCAFEBABE. This means that beans are stored in jars, to make coffee, babe!"
  
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-418-im-a-teapot.svg"
    image_source: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/418"
    pun_alt_text: "418 I'm a teapot"
    popup_blurb: "Some april fools jokes introduced HTTP Status Code 418 as part of RFC 2324 and RFC 9110. 'computists want to make coffee ... Networked coffee pots require a control protocol if they are to be controlled'. 418 indicates that the server refuses to brew coffee because it is, permanently, a teapot. This HTTP Status Code is unused in practice (RFC 9110)"
    
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-python-anaconda.svg"
    image_source: "https://docs.python.org/3/faq/general.html#why-is-it-called-python"
    pun_alt_text: "Python vs Anaconda"
    popup_blurb: "Python is a programming language, whose name was inspired by 'Monty Python's Flying Circus'. Anaconda is the heavy-duty toolbox built around the Python engine (hence a bigger snake - it packs in way more packages!)"
    
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-jekyll-markdown-to-markup.svg"
    image_source: "https://www.heavybit.com/library/podcasts/the-kubelist-podcast/ep-35-the-open-source-journey-with-tom-preston-werner"
    pun_alt_text: "Jekyll and Markdown vs Markup"
    popup_blurb: "Markup comes from the publishing world, where editors literally 'marked up' paper manuscripts with formatting instructions. 'Markdown' was named as a clever, ironic pun—it strips away the heavy code to simplify writing. HTML is an example of something with verbose formatting instructions. i.e. Markup signals adding value or complexity, while markdown means reducing or simplifying it. Jekyll (like the story or Jekyll and Hyde) takes your polite, clean Markdown files and programmatically transforms them into a 'monster' of a website! (raw HTML for the web browser to read). The attached link is a transcript from a podcast - <CTRL + F> to find Hyde there"
  
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-git-meaning.svg"
    image_source: "https://www.youtube.com/shorts/rLxjsk3NAKM"
    pun_alt_text: "Meaning of GIT"
    popup_blurb: "Git as a version control system is used by developers all over the world. What does it mean? The very first commit mentions: mispronunciation of 'get'; an insult from common slang (stupid etc); Global Information Tracker when it works for you; Goddam Idiotic Truckload of SH!T when it breaks"
    
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-tidbit-cucumber-name-origin.svg"
    image_source: "https://www.quora.com/Why-is-the-Cucumber-tool-for-BDD-named-as-such"
    pun_alt_text: "Cucumber name origin"
    popup_blurb: "Cucumber is a programming tool that supports Behaviour-Driven Design (BDD) and uses a syntax that is also food themed: Gherkin! Why is called this? The author's then-fiance recommended it! This [... catchy, non-geeky sounding name] stuck!"
    
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-tidbit-vertical-slice-explained.svg"
    image_source: "https://dev.to/adrianbailador/vertical-slice-architecture-in-net-k80"
    pun_alt_text: "Vertical Slice Explained"
    popup_blurb: "When thinking about horizontal vs vertical architecture we can imagine a layered cake. Horizontal Architecture (traditional) cuts the cake sideways along the layers — Presentation, Business Logic, Data Access. Vertical Architecture cuts it upwards - each slice contains the parts needed to do one thing. Links nicely to Behaviour-Driven Design, especially if your tool can do frontend and backend onetime (like .NET). If you were receiving a slice of cake - would you prefer only 1 layer (icing), or some of each layer?"
    
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-tidbit-rouge-syntax-highlighter.svg"
    image_source: "https://github.com/rouge-ruby/rouge/blob/main/rouge.gemspec"
    pun_alt_text: "Ruby and Rouge explained"
    popup_blurb: "Rouge is a code highlighter, similar to another popular tool written in python called pygments. To continue with the colour theme - 'rouge' (French for RED) fits nicely as it is also written in the programming language called ruby! The rouge.gemspec on GitHub mentions this. Why is Ruby called that? Well, the author of Ruby wanted to make a superior language to 'Perl'! And Perl was named by its author after 'pearl of great price' from the Gospel of Matthew. Rouge is used in this website to colour the callouts - there is a post exploring that as well!"

  - image_vault: "assets/88x31/buttons-tidbits/tidbit-tidbit-blender-name-origin.svg"
    image_source: "https://www.blender.org/about/history/"
    pun_alt_text: "Blender name origin"
    popup_blurb: "Blender is a 3D computer graphics software that is widely used for creating animated films, visual effects, and interactive applications. You may think that the name 'Blender' comes from the idea of combining different elements together, much like a kitchen blender combines ingredients. In reality though, its just named after a song! (Swiss band Yello's 1985 song 'Blender' from the album 'Stella'). The song was used in a demo of the software at a computer graphics conference, and the name stuck! The song itself is almost a surreal comedy about a fancy kitchen blender (reminds me of Money for Nothing by Dire Straits)"
    
  - image_vault: "assets/88x31/buttons-tidbits/tidbit-tidbit-ms-azure-and-red-dog.svg"
    image_source: "https://www.zdnet.com/article/microsoft-red-dog-a-pink-poodle-in-disguise/"
    pun_alt_text: "MS Azure vs internal name red dog"
    popup_blurb: "Microsoft Azure has been created as clever branding, hoping to be associated with the blue colour of a clear sky; hoping to symbolize open space, infinite scalability, and the sky-and-cloud connection. But more interestingly, Initially the project was known as 'Project Red Dog'. This originates from this team passing a strip club in California called 'the pink poodle'! Dave Cutler joked about naming it after the club, and they settled instead on 'Red Dog'!"
