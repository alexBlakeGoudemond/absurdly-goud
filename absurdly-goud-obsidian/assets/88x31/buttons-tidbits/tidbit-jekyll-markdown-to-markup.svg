<svg xmlns="http://www.w3.org/2000/svg"
     width="88"
     height="31"
     viewBox="0 0 88 31">

    <!-- Background -->
    <rect
            x="0"
            y="0"
            width="88"
            height="31"
            rx="7"
            fill="#1c1c1c"/>

    <!-- =========================================================
         JEKYLL TEST TUBE
         ========================================================= -->
    <g transform="translate(4 3)">

        <g transform="rotate(18 8 12)">

            <!-- Glass -->
            <path
                    d="M3 2
                   H13
                   V19
                   A5 5 0 0 1 3 19
                   Z"
                    fill="#f4f4f4"
                    stroke="#999"
                    stroke-width="0.8"/>

            <!-- Liquid -->
            <path
                    d="M3 11
                   H13
                   V19
                   A5 5 0 0 1 3 19
                   Z"
                    fill="#c81111"/>

            <!-- Liquid surface -->
            <ellipse
                    cx="8"
                    cy="11"
                    rx="5"
                    ry="1.1"
                    fill="#9c0f0f"/>

            <!-- Rim -->
            <ellipse
                    cx="8"
                    cy="2"
                    rx="5"
                    ry="1.5"
                    fill="#dedede"
                    stroke="#888"
                    stroke-width="0.8"/>

            <ellipse
                    cx="8"
                    cy="1.8"
                    rx="3"
                    ry="0.7"
                    fill="#333"/>

            <!-- Bubbles -->
            <circle cx="6.5" cy="15" r="0.8"
                    fill="#fff" opacity="0.45"/>
            <circle cx="9.5" cy="17" r="0.55"
                    fill="#fff" opacity="0.4"/>

            <!-- Highlight -->
            <path
                    d="M5 4 V17"
                    stroke="#fff"
                    stroke-width="0.9"
                    stroke-linecap="round"
                    opacity="0.55"/>
        </g>
    </g>


    <!-- =========================================================
         MARKDOWN ICON 1
         M + DOWN ARROW
         ========================================================= -->

    <!-- M -->
    <g transform="translate(0 3)" fill="#ffffff">
        <rect
                x="23"
                y="3.5"
                width="26"
                height="18"
                rx="3"
                stroke="#FFFFFF"
                stroke-width="1"
                fill="none"/>
        <path d="M25 7 H28 L31.5 12 L35 7 H38 V18 H35 V11 L31.5 16 L28 11 V18 H25 Z"/>
    </g>

    <!-- Down arrow -->
    <g transform="translate(1 2)" fill="#ffffff">
        <rect
                x="53"
                y="4.5"
                width="26"
                height="18"
                rx="3"
                stroke="#FFFFFF"
                stroke-width="1"
                fill="none"/>
        <path d="M41 8 H44 V14 H47 L42.5 19 L38 14 H41 Z"/>
    </g>


    <!-- =========================================================
         MARKDOWN ICON 2
         M + DOWN ARROW
         ========================================================= -->

    <!-- M -->
    <g transform="translate(3 3)" fill="#ffffff">
        <path d="M53 7 H56 L59.5 12 L63 7 H66 V18 H63 V11 L59.5 16 L56 11 V18 H53 Z"/>
    </g>

    <!-- Down arrow -->
    <g transform="translate(32 2)" fill="#ffffff">
        <path d="M41 19 H44 V13 H47 L42.5 8 L38 13 H41 Z"/>
    </g>

</svg>