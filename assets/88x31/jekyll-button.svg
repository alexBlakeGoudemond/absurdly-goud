<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 88 31"
     width="88"
     height="31"
     preserveAspectRatio="xMidYMid meet">

    <!-- Generated using AI using this as reference: https://en.wikipedia.org/wiki/Jekyll_(software)#/media/File:Jekyll_(software)_Logo.png  -->

    <rect x="0" y="0" width="88" height="31" fill="#1c1c1c" rx="7"/>

    <defs>
        <linearGradient id="tubeGlass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#e8e8e8"/>
            <stop offset="45%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#c9c9c9"/>
        </linearGradient>

        <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7a0f0f"/>
            <stop offset="50%" stop-color="#c81111"/>
            <stop offset="100%" stop-color="#8f0e0e"/>
        </linearGradient>
    </defs>

    <!-- Jekyll artwork -->
    <g transform="translate(-14 3.25) scale(1.5)">

        <!-- jekyll -->
        <text x="16"
              y="11.5"
              font-family="'Segoe Script','Brush Script MT','Apple Chancery',cursive"
              font-size="11"
              font-style="italic"
              fill="#f5f5f5">Jekyll
        </text>

        <!-- test tube -->
        <g transform="translate(57,3.5) rotate(18) scale(0.065)">

            <!-- glass body -->
            <path d="M -16,0
                     l32,0
                     l0,150
                     a16,16 0 0 1 -32,0
                     z"
                  fill="url(#tubeGlass)"
                  stroke="#9a9a9a"
                  stroke-width="2"/>

            <!-- red liquid -->
            <path d="M -16,65
                     l32,0
                     l0,85
                     a16,16 0 0 1 -32,0
                     z"
                  fill="url(#liquid)"/>

            <!-- meniscus -->
            <ellipse cx="0"
                     cy="95"
                     rx="16"
                     ry="4"
                     fill="#9c0f0f"
                     opacity="0.6"/>

            <!-- rim -->
            <ellipse cx="0"
                     cy="0"
                     rx="16"
                     ry="6"
                     fill="#dedede"
                     stroke="#8f8f8f"
                     stroke-width="2"/>

            <ellipse cx="0"
                     cy="-1"
                     rx="9"
                     ry="3"
                     fill="#3a3a3a"/>

            <!-- bubbles -->
            <circle cx="-5" cy="120" r="3"
                    fill="#ffffff"
                    opacity="0.35"/>

            <circle cx="6" cy="135" r="2"
                    fill="#ffffff"
                    opacity="0.3"/>

            <!-- glass highlight -->
            <path d="M -10,10 l0,130"
                  stroke="#ffffff"
                  stroke-width="3"
                  stroke-linecap="round"
                  opacity="0.5"/>
        </g>
    </g>
</svg>