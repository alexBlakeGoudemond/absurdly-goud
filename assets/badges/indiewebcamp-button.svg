          y="1"
          width="86"
          height="29"
          fill="white"
          rx="7"/>

    <!-- Orange section: sharp on left, rounded on right -->
    <defs>
        <clipPath id="orange-section">
            <path d="M33.8 1
                     H80
                     A7 7 0 0 1 87 8
                     V23
                     A7 7 0 0 1 80 30
                     H33.8
                     Z"/>
        </clipPath>
    </defs>

    <g clip-path="url(#orange-section)">
        <rect x="33.8" y="1" width="53.2" height="3" fill="#fda829"/>
        <rect x="33.8" y="4" width="53.2" height="3" fill="#fd9025"/>
        <rect x="33.8" y="7" width="53.2" height="3" fill="#fd7222"/>
        <rect x="33.8" y="10" width="53.2" height="3" fill="#fc561f"/>
        <rect x="33.8" y="13" width="53.2" height="3" fill="#fc481e"/>
        <rect x="33.8" y="16" width="53.2" height="3" fill="#fc371d"/>
        <rect x="33.8" y="19" width="53.2" height="3" fill="#fc291c"/>
        <rect x="33.8" y="22" width="53.2" height="3" fill="#fc1c1c"/>
        <rect x="33.8" y="25" width="53.2" height="5" fill="#fc1c1c"/>
