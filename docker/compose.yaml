services:

  jekyll:
    build:
      context: ..
      dockerfile: docker/ruby/Dockerfile

    working_dir: /site

    volumes:
      - ..:/site
      - ai_playbook_stub:/site/.ai-playbook:ro

    ports:
      - "4000:4000"

    command: >
      bash -c "bundle install &&
      bundle exec jekyll serve --host 0.0.0.0 --livereload"

volumes:
  ai_playbook_stub: {}