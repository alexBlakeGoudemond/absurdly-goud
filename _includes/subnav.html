{% assign current_section = page.section %}
{% for item in site.data.nav %}
    {% if item.title == current_section and item.children %}
        <nav class="subnav">
            {% for child in item.children %}
            <a href="{{ child.url | relative_url }}"
               class="subnav-link {% if page.url == child.url %}active{% endif %}">
                {{ child.title }}
            </a>
            {% endfor %}
        </nav>
    {% endif %}
{% endfor %}
