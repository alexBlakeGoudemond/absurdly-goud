<svg class="water-background"
     viewBox="0 0 1000 1000"
     preserveAspectRatio="none">

    <g id="waves">
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
        <path class="wave"></path>
    </g>
</svg>


<!-- Duck ripples -->
<svg class="ripple-background"
     viewBox="0 0 1000 1000"
     preserveAspectRatio="none">
    <g id="duck-ripples"></g>
</svg>


{%- for file in site.static_files -%}
    {%- if file.path contains '/assets/site-background/' and file.path contains '.svg' -%}
        <img class="pond-duck" id="pond-duck-{{ forloop.index }}" src="{{ file.path | relative_url }}" alt="" aria-hidden="true">
    {%- endif -%}
{%- endfor -%}

<script src="{{ '/assets/js/pond.js' | relative_url }}"></script>
<script src="{{ '/assets/js/navigation.js' | relative_url }}"></script>
