<article class="h-entry">

    <header>
        <h1 class="p-name">{{ page.title }}</h1>

        <time class="dt-published"
              datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%d %B %Y" }}
        </time>
    </header>

    <div class="e-content">
        {% assign post_media = "/media/post/"
            | append: page.date | date: "%Y/%m/%d/"
            | append: page.slug
            | append: "/" %}

        {{ content }}
    </div>

</article>
