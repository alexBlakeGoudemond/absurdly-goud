---
layout: default
---

<article class="h-entry">

    <header>
        <h2 class="p-name">{{ page.title }}</h2>

        {% assign display_date = post.last_published | default: post.date %}
        <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%Y-%m-%d %H:%M" }}
        </time>
    </header>

    <div class="e-content">
        {% assign post_media = "/media/post/"
            | append: page.date | date: "%Y/%m/%d/"
            | append: page.slug
            | append: "/" %}

        {{ content }}
    </div>

</article>
